name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *" # Every 12 hours

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Rabi22

          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#10B981&color_dots=#ebedf0,#c6e48b,#7bc96f,#239a3b,#196127

            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#10B981&color_dots=#2d3343,#0e4429,#006d32,#26a641,#39d353

      - name: Publish Snake Files
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
